<div class="dashboard-wrapper" [class.sidebar-expanded]="isExpanded">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">I</div>
      <button class="expand-toggle" (click)="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline [attr.points]="isExpanded ? '15 18 9 12 15 6' : '9 18 15 12 9 6'"></polyline>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard/overview" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span class="nav-label">Accueil</span>
      </a>
      <a routerLink="/dashboard/mosquees" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-4a3 3 0 0 1 6 0v4"></path></svg>
        <span class="nav-label">Mosquées</span>
      </a>
      <a routerLink="/dashboard/users" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span class="nav-label">Utilisateurs</span>
      </a>
      <a routerLink="/dashboard/publicites" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span class="nav-label">Publicités</span>
      </a>
      <a routerLink="/dashboard/radios" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        <span class="nav-label">Radios</span>
      </a>
      <a routerLink="/dashboard/stats" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span class="nav-label">Statistiques</span>
      </a>
      <a routerLink="/dashboard/validation" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
        <span class="nav-label">Validation</span>
      </a>
      <a routerLink="/dashboard/horaires-priere" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
        <span class="nav-label">Horaires de Prière</span>
      </a>
      <a routerLink="/dashboard/profile" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"></circle><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path></svg>
        <span class="nav-label">Mon Profil</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="theme-selector">
        <button (click)="setTheme('normal')" [class.active]="currentTheme === 'normal'" title="Thème Normal"></button>
        <button (click)="setTheme('dark')" [class.active]="currentTheme === 'dark'" title="Thème Sombre"></button>
        <button (click)="setTheme('light')" [class.active]="currentTheme === 'light'" title="Thème Clair"></button>
      </div>
      <div class="user-profile-nav">
        <div class="user-info-side" routerLink="/dashboard/profile">
          <div class="avatar">{{ user?.email?.charAt(0)?.toUpperCase() }}</div>
          <div class="user-meta" *ngIf="isExpanded">
            <p class="user-email text-truncate">{{ user?.email?.split('@')[0] }}</p>
            <span class="view-profile">Voir profil</span>
          </div>
        </div>
        <button class="logout-btn" (click)="onLogout()" title="Déconnexion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
